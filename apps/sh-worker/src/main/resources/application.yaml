spring:
  datasource:
    url: 'jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:super_harness}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true'
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  autoconfigure:
    exclude: org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
  main:
    web-application-type: none

server:
  shutdown: graceful

logging:
  level:
    io.agentscope.harness.agent.middleware.AgentTraceMiddleware: 'OFF'

management:
  tracing:
    enabled: ${SH_TRACING_ENABLED:false}
    export:
      otlp:
        enabled: ${SH_TRACING_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${SH_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

sh:
  models:
    openai:
      base-url: ${SH_OPENAI_BASE_URL:}

---
spring:
  config:
    activate:
      on-profile: local

sh:
  models:
    web-search-models: ${SH_WEB_SEARCH_MODELS:token-plan:qwen4-max,token-plan:deepseek-v4.1-flash-1017}
    token-plan:
      base-url: ${SH_TOKEN_PLAN_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      api-key: ${SH_TOKEN_PLAN_API_KEY:${DASHSCOPE_API_KEY:}}
